apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-autopilot
  namespace: benni-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app: community-autopilot
  template:
    metadata:
      labels:
        app: community-autopilot
    spec:
      containers:
        - name: autopilot
          image: ghcr.io/benni-os/community-autopilot:latest
          args: ["serve"]
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: community-autopilot-secrets
